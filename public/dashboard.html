<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Hub | لوحة التحكم</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 620px; margin: 40px auto; padding: 20px; background: #f5f7fb; color: #172033; }
    main { background: white; padding: 28px; border-radius: 12px; box-shadow: 0 8px 28px #17203318; }
    a { color: #155eef; }
  </style>
</head>
<body>
  <main>
    <h1>لوحة التحكم جاهزة</h1>
    <p>مرحبًا بك، <strong id="email"></strong></p>
    <p>تم تسجيل الدخول بنجاح.</p>
    <a href="/">العودة</a>
  </main>
  <script>
    fetch('/api/auth/me').then(response => {
      if (!response.ok) location.href = '/';
      return response.json();
    }).then(body => { document.getElementById('email').textContent = body.email; });
  </script>
</body>
</html>
